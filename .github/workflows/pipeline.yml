name: Build literature tree

on:
  push:
    paths:
      - "data/RQ_generator_dataset.xlsx"
      - "src/build_tree.py"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: literature-tree-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # (build_tree가 표준라이브러리만 쓰면 deps 불필요. 필요하면 남겨두기)
      - name: Install deps
        run: |
          python -m pip install --upgrade pip

      # 1) Build tree.json from RQ_generator_dataset.xlsx
      - name: Build tree.json (RQ_generator_dataset.xlsx -> tree.json)
        run: |
          python src/build_tree.py --papers data/RQ_generator_dataset.xlsx --out tree.json

      # 2) Upload outputs as artifact
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: tree_output
          path: |
            tree.json

      # 3) Commit tree.json back to repo (direct push to main)
      - name: Commit tree.json (if changed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tree.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update tree.json from papers.jsonl"
          git push
