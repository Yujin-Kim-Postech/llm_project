# Description: Empirical-Only Minimal Tree (2-depth) for Insurance/Risk Economics

L1:
  - A. Insurance Demand · Contracts · Market Frictions
  - B. Claims · Pricing · Reserving
  - C. Catastrophe · Climate · Reinsurance · ILS
  - D. Operational · Cyber · Technology Risk
  - E. Finance & Macro-Finance Links

L2:
  A. Insurance Demand · Contracts · Market Frictions:
    - A1. Insurance demand / purchase behavior (household & corporate)
    - A2. Contracts, underwriting & information frictions (AS/MH/Fraud)
    - A3. Market structure, regulation & availability/affordability

  B. Claims · Pricing · Reserving:
    - B1. Claim frequency/severity & loss prediction (traditional + ML)
    - B2. Reserving / claims development / IBNR

  C. Catastrophe · Climate · Reinsurance · ILS:
    - C1. Nat-cat & climate extremes: losses/exposure/insurance outcomes
    - C2. Reinsurance: capacity, pricing cycles, supply frictions
    - C3. CAT bonds / ILS: issuance, spreads, triggers, basis risk

  D. Operational · Cyber · Technology Risk:
    - D1. Operational risk (loss events & loss data empirics)
    - D2. Cyber risk (events, contagion, firm value, cyber insurance)

  E. Finance & Macro-Finance Links:
    - E1. Risk premia & asset pricing (empirical; disaster/tail/uncertainty)
    - E2. Intermediation, systemic risk & financial stability (incl. insurers)
    - E3. Climate finance (physical/transition risk in markets & corporate finance)

# L2_RULES: regex/keywords for weak labeling
# - Empirical-only intention: focuses on applied/empirical keywords; still broad enough to catch adjacent work.
# - Use lower/upper-case robust patterns via explicit alternations where needed.

L2_RULES:
  A. Insurance Demand · Contracts · Market Frictions:
    A1. Insurance demand / purchase behavior (household & corporate):
      - "\\b(insurance demand|demand for insurance|take[- ]?up|purchase|buying|coverage choice|coverage|deductible|premium sensitivity|price elasticity|renewal|lapse|switching)\\b"
      - "\\b(learning|salience|risk aversion|ambiguity aversion|prospect theory)\\b"
    A2. Contracts, underwriting & information frictions (AS/MH/Fraud):
      - "\\b(adverse selection|moral hazard|asymmetric information|information asymmetry|screening|underwriting)\\b"
      - "\\b(risk classification|experience rating|bonus[- ]?malus|fraud|claim inflation|monitoring|verification)\\b"
    A3. Market structure, regulation & availability/affordability:
      - "\\b(regulation|rate regulation|solvency|capital requirement|competition|market power)\\b"
      - "\\b(insurer (entry|exit)|entry|exit|availability|affordability|residual market|uninsurability)\\b"

  B. Claims · Pricing · Reserving:
    B1. Claim frequency/severity & loss prediction (traditional + ML):
      - "\\b(frequency|severity|loss model(l)?ing|loss prediction|GLM|GAM|credibility|mixture|latent class)\\b"
      - "\\b(copula)\\b"
      - "\\b(telematics|usage[- ]?based insurance|UBI|machine learning pricing|pricing model|fairness|explainability|XAI)\\b"
      - "\\b(machine learning|ML|AI|neural|prediction)\\b"
    B2. Reserving / claims development / IBNR:
      - "\\b(reserving|IBNR|claims development|loss triangle(s)?|triangle(s)?)\\b"
      - "\\b(chain ladder|stochastic reserving|Bayesian reserving|IFRS\\s?17)\\b"

  C. Catastrophe · Climate · Reinsurance · ILS:
    C1. Nat-cat & climate extremes: losses/exposure/insurance outcomes:
      - "\\b(catastrophe|cat|nat[- ]?cat|natural disaster|flood|wildfire|hurricane|earthquake)\\b"
      - "\\b(climate risk|extreme(s)?|hazard|exposure|vulnerability|insured loss|adaptation|mitigation)\\b"
    C2. Reinsurance: capacity, pricing cycles, supply frictions:
      - "\\b(reinsurance|retrocession|capacity|capital constraints|supply friction(s)?)\\b"
      - "\\b(pricing cycle|hard market|soft market|reinsurance pricing)\\b"
    C3. CAT bonds / ILS: issuance, spreads, triggers, basis risk:
      - "\\b(catastrophe bond(s)?|cat bond(s)?|ILS|insurance[- ]linked securit(y|ies))\\b"
      - "\\b(spread(s)?|issuance|trigger(s)?|parametric|index|indemnity|basis risk|secondary market|rating|performance)\\b"

  D. Operational · Cyber · Technology Risk:
    D1. Operational risk (loss events & loss data empirics):
      - "\\b(operational risk|op risk|internal loss data|loss data)\\b"
      - "\\b(LDA|loss distribution approach|scenario analysis|SMA|AMA|process failure(s)?|control(s)?)\\b"
      - "\\b(capital)\\b"
    D2. Cyber risk (events, contagion, firm value, cyber insurance):
      - "\\b(cyber risk|data breach|ransomware|systemic cyber|accumulation risk)\\b"
      - "\\b(contagion|common shock|event study|firm value|stock market)\\b"
      - "\\b(cyber insurance|insurance demand|pricing)\\b"

  E. Finance & Macro-Finance Links:
    E1. Risk premia & asset pricing (empirical; disaster/tail/uncertainty):
      - "\\b(asset pricing|risk premia|risk premium|tail risk|disaster risk|volatility|uncertainty|predictability)\\b"
      - "\\b(factor model(s)?|equity premium|insurance[- ]linked return(s)?)\\b"
    E2. Intermediation, systemic risk & financial stability (incl. insurers):
      - "\\b(intermediation|systemic risk|financial stability|contagion|liquidity|run(s)?|stress test(s)?)\\b"
      - "\\b(insurer investment|ALM|asset[- ]liability|regulation impact)\\b"
    E3. Climate finance (physical/transition risk in markets & corporate finance):
      - "\\b(climate finance|physical risk|transition risk|carbon exposure|stranded asset(s)?)\\b"
      - "\\b(climate beta|cost of capital|lending|investment)\\b"
